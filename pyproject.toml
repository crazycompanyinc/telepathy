[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telepathy"
version = "2.0.0"
description = "Production-grade real-time agent workspace intelligence system."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Telepathy"}]
dependencies = [
  "click>=8.1",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.27",
  "websockets>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
telepathy = "telepathy.cli:cli"
teleyt = "telepathy.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["telepathy*"]
